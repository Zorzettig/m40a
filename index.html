<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M40a App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f0f2f5">
    <!-- Icona per iOS -->
    <link rel="apple-touch-icon" href="icona.jpg">
</head>
<body>
    <div class="container">
        <header>
            <h1>Compilazione M40a</h1>
        </header>

        <form id="m40a-form">
            <!-- Dati Modulo -->
            <section class="card">
                <h2>Dati Modulo</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="numero-m40">Numero M. 40a</label>
                        <input type="text" id="numero-m40" required placeholder="Es. 4">
                    </div>
                    <div class="form-group">
                        <label for="numero-treno">Numero Treno</label>
                        <input type="text" id="numero-treno" required placeholder="Es. 16619">
                    </div>
                </div>
                <div class="form-group">
                    <label for="data-emissione">Data</label>
                    <input type="date" id="data-emissione" required>
                </div>
            </section>

            <!-- Prescrizione -->
            <section class="card">
                <h2>Prescrizione</h2>
                <div class="form-group toggle-group">
                    <label>Azione</label>
                    <div class="radio-toggle">
                        <input type="radio" id="azione-ordina" name="azione" value="ordina" checked>
                        <label for="azione-ordina">Si ordina</label>
                        
                        <input type="radio" id="azione-avviso" name="azione" value="avviso">
                        <label for="azione-avviso">Si dà avviso</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="ruolo">Ruolo Destinatario (A...)</label>
                    <input type="text" id="ruolo" required placeholder="Es. AdC, MACCHINISTA, DCO...">
                </div>

                <div class="form-group">
                    <label for="testo-prescrizione">Testo Prescrizione</label>
                    <textarea id="testo-prescrizione" rows="6" required placeholder="Inserisci il testo qui (verrà distribuito su max 8 righe nel PDF)"></textarea>
                </div>
            </section>

            <!-- Emittente -->
            <section class="card">
                <h2>Emittente (Firma sinistra)</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="cognome-emittente">Cognome</label>
                        <input type="text" id="cognome-emittente" required placeholder="Es. BIRRINI">
                    </div>
                    <div class="form-group">
                        <label for="progressivo-emittente">Progressivo</label>
                        <input type="text" id="progressivo-emittente" required placeholder="Es. 13/43">
                    </div>
                </div>
                <div class="form-group">
                    <label for="ora-emissione">Ora</label>
                    <input type="time" id="ora-emissione" required>
                </div>
            </section>

            <!-- Agente di Condotta -->
            <section class="card">
                <h2>Agente di Condotta (Firma destra)</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="cognome-adc">Cognome</label>
                        <input type="text" id="cognome-adc" required placeholder="Es. ZORZETTIG">
                    </div>
                    <div class="form-group">
                        <label for="progressivo-adc">Progressivo</label>
                        <input type="text" id="progressivo-adc" required placeholder="Es. 17/22">
                    </div>
                </div>
            </section>

            <!-- Azioni -->
            <div class="actions">
                <button type="button" id="btn-visualizza" class="btn btn-secondary" style="background-color: #4b5563; color: white;">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    Visualizza PDF
                </button>
                <button type="button" id="btn-scarica" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Scarica PDF
                </button>
                <button type="button" id="btn-svuota" class="btn btn-danger">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                    Svuota tutti i campi
                </button>
            </div>
        </form>
    </div>

    <!-- Script per modificare il PDF -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="pdf-generator.js"></script>
    <script src="app.js"></script>
    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(registration => {
                    console.log('SW registered: ', registration);
                }).catch(registrationError => {
                    console.log('SW registration failed: ', registrationError);
                });
            });
        }
    </script>
</body>
</html>
